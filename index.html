<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Pixel Adventure 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game"></div>
<div id="loading">Memuat dunia…</div>
<div id="hud">
  <div class="brand">PIXEL <span>ADVENTURE</span></div>
  <div id="stats"><span>❤ <b id="hp">100</b></span><span>▣ <b id="blocks">12</b></span><span>✦ <b id="gems">0</b></span></div>
  <button id="pause" aria-label="Jeda">Ⅱ</button>
</div>
<div id="crosshair">＋</div>
<div id="hint">Jelajahi • Kumpulkan kristal • Bangun duniamu</div>
<div id="joystick"><div id="joy-knob"></div></div>
<div id="lookzone" aria-label="Geser untuk memutar kamera"></div>
<div id="actions">
  <button id="jump" class="action">↑<small>Lompat</small></button>
  <button id="mine" class="action">▧<small>Ambil</small></button>
  <button id="build" class="action">＋<small>Pasang</small></button>
  <button id="attack" class="action">⚔<small>Serang</small></button>
</div>
<div id="message"></div>
<div id="pausemenu" class="hidden">
  <div class="panel"><h1>Petualangan dijeda</h1><p>Dunia disimpan otomatis di perangkat ini.</p>
  <button id="resume">Lanjutkan</button><button id="save">Simpan sekarang</button><button id="reset">Mulai dunia baru</button>
  <p class="tiny">Tip: gerakkan joystick kiri, geser sisi kanan untuk memutar kamera.</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
